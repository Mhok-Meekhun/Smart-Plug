services:
  - type: web
    name: smart-home-web
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @smart-home/web build
    startCommand: pnpm --filter @smart-home/web start
    healthCheckPath: /th/dashboard
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://xxzhkgpyfchvcwvrjzer.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"

  - type: web
    name: smart-home-api
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @smart-home/api build
    startCommand: pnpm --filter @smart-home/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://xxzhkgpyfchvcwvrjzer.supabase.co
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: WEB_ORIGIN
        sync: false

  - type: worker
    name: smart-home-iot-worker
    runtime: node
    region: singapore
    plan: starter
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildCommand: corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm --filter @smart-home/iot-worker build
    startCommand: pnpm --filter @smart-home/iot-worker start
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://xxzhkgpyfchvcwvrjzer.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_CLIENT_ID
        value: smart-home-worker-production
      - key: OUTBOX_POLL_MS
        value: "500"
