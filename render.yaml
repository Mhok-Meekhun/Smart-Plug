services:
  - type: web
    name: smart-home-web
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@smart-home/web...
    startCommand: pnpm --filter @smart-home/web start
    healthCheckPath: /th/auth/login
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://xxzhkgpyfchvcwvrjzer.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"

  - type: web
    name: smart-home-api
    runtime: node
    region: singapore
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && corepack prepare pnpm@10.15.1 --activate && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@smart-home/api...
    startCommand: pnpm --filter @smart-home/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://xxzhkgpyfchvcwvrjzer.supabase.co
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: WEB_ORIGIN
        sync: false
